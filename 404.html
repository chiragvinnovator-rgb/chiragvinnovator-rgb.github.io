<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #061211; color: #f1eadb; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 16px; }
  main { max-width: 34rem; }
  p.k { font-family: ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6fe3cf; margin: 0 0 14px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: clamp(34px, 7vw, 64px); line-height: 1.05; margin: 0; }
  p { color: #a9bbb4; line-height: 1.55; }
  a { display: inline-block; margin-top: 14px; padding: 11px 17px; border-radius: 999px; background: #ff5b2e; color: #1a0903; font-family: ui-monospace, Consolas, monospace; font-size: 13px; text-decoration: none; }
  a:focus-visible { outline: 2px solid #6fe3cf; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="k">Page not found</p>
  <h1>This path leads nowhere.</h1>
  <p>The page may have moved. The homepage has every project.</p>
  <a id="home" href="./">&larr; Back to the homepage</a>
</main>
<script>
  // Work out the site's root whether it is published at the domain root or under /repository-name/.
  (function () {
    var parts = location.pathname.split('/');
    var underRepo = /\.github\.io$/.test(location.hostname) && parts.length > 2;
    document.getElementById('home').href = underRepo ? '/' + parts[1] + '/' : '/';
  })();
</script>
</body>
